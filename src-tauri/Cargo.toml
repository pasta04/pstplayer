[package]
name = "pstplayer"
version = "0.0.1"
description = "Cross-platform PeerCast viewer with integrated BBS support"
authors = ["pasta04"]
edition = "2021"
license = "MIT"
repository = "https://github.com/pasta04/pstplayer"

[lib]
name = "pstplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
url = "2"
encoding_rs = "0.8"
regex = "1"
once_cell = "1"
toml = "0.8"
directories = "5"
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
