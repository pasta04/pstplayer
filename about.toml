# cargo-about 設定: THIRD-PARTY.md 生成時の許容ライセンス。
#
# PSTPlayer 本体は MIT。下記は依存クレートの再配布で問題のない
# OSI 承認 / FSF 互換ライセンスのみを許可。GPL / LGPL / SSPL 等は
# 含まない (libmpv は LGPL だが Cargo 依存ではなく動的リンクなので
# このリストの対象外)。
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    # libmpv2 / libmpv2-sys のための明示許容。libmpv 自体は別ライセンス
    # の動的リンクなので義務はそちらに集中する (LGPL の取り扱いは
    # docs/release.md §5.2 を参照)。
    "LGPL-2.1",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
