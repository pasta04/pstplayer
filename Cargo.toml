# Cargo workspace root.
# See docs/decisions/0005-workspace-and-server.md for the rationale.

[workspace]
members = [
    "crates/pst-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["pasta04"]
repository = "https://github.com/pasta04/pstplayer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
url = "2"
encoding_rs = "0.8"
regex = "1"
once_cell = "1"
toml = "0.8"
directories = "5"
quick-xml = { version = "0.36", features = ["serialize"] }
ammonia = "4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
