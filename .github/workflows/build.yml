name: Build artifacts

# 配布バイナリ生成は重い (libmpv-dev + cargo tauri build × 3 OS) ため、
# PR では走らせず、main へのマージ後 と 手動起動 (workflow_dispatch) のみ。
# PR で動作確認したい場合は Actions タブから "Run workflow" → ブランチ選択。
on:
  push:
    branches:
      - main
      # 開発ブランチでも artifact を取れるよう一時的に許可。
      # main マージ後はこの行を削除し、main + workflow_dispatch のみに戻す。
      - claude/focused-mendel-rvEAd
    tags:
      # `v0.1.0` 等の SemVer タグで release ジョブも走る。
      # 詳細は docs/release.md §6.2 を参照。
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
            experimental: false
          - os: macos-latest
            artifact: macos
            experimental: false
          - os: windows-latest
            artifact: windows
            experimental: false

    steps:
      - uses: actions/checkout@v4

      # ── OS-specific native deps ──────────────────────────────────────

      - name: Install Tauri + libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libfuse2 \
            libmpv-dev \
            pkg-config

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv pkg-config
          MPV_PREFIX="$(brew --prefix mpv)"
          echo "MPV_PREFIX=${MPV_PREFIX}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L ${MPV_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MPV_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${MPV_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # shinchiro's mpv-dev only ships MinGW import lib (libmpv.dll.a).
          # MSVC needs mpv.lib — generate it from libmpv-2.dll via
          # dumpbin /exports → .def → lib /def:.
          $url  = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260530/mpv-dev-x86_64-v3-20260530-git-13a3e3a.7z'
          $tmp  = "$env:TEMP\mpv-dev.7z"
          $base = "$env:GITHUB_WORKSPACE\mpv-dev"
          $sub  = Join-Path $base '64'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tmp
          New-Item -ItemType Directory -Force -Path $sub | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $tmp -o"$sub" -y

          $dll = Join-Path $sub 'libmpv-2.dll'
          $def = Join-Path $sub 'mpv.def'
          $lib = Join-Path $sub 'mpv.lib'
          $exports = & dumpbin.exe /exports $dll
          $names = @()
          foreach ($line in $exports) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
              $names += $Matches[1]
            }
          }
          if ($names.Count -eq 0) { throw "failed to extract exports from $dll" }
          # LIBRARY ディレクティブで import-name を libmpv-2.dll に固定
          # (詳細は ci.yml 内の同名ステップを参照)。
          'LIBRARY libmpv-2.dll' | Out-File -FilePath $def -Encoding ascii
          'EXPORTS'              | Out-File -FilePath $def -Encoding ascii -Append
          $names                  | Out-File -FilePath $def -Encoding ascii -Append
          & lib.exe /def:$def /out:$lib /machine:x64
          if (-not (Test-Path $lib)) { throw "lib.exe did not produce $lib" }

          "MPV_SOURCE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Stage the runtime DLL into System32 so the test binary and
          # tauri-bundled exe can find it without PATH tricks.
          Copy-Item "$sub\libmpv-2.dll" "$env:WINDIR\System32\" -Force

      # ── Toolchains ───────────────────────────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # ── Build ────────────────────────────────────────────────────────

      - name: Tauri build (release, non-Windows)
        if: runner.os != 'Windows'
        run: npm run tauri build

      # macOS: bundle libmpv (and its transitive dylibs) into the .app
      # so users don't need `brew install mpv`. Without this the main
      # binary references /opt/homebrew/... directly.
      - name: Bundle libmpv into .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # NOTE: deliberately no `set -e`. `grep` returns exit 1 when nothing
        # matches, which is a normal "leaf of dependency tree" condition for
        # us and must not abort the script.
        run: |
          set -u
          APP="target/release/bundle/macos/PSTPlayer.app"
          if [ ! -d "$APP" ]; then
            echo "no .app produced at $APP, skipping libmpv bundling"
            exit 0
          fi
          MAIN="$APP/Contents/MacOS/pstplayer"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          # List the non-system, non-@rpath dylibs referenced by $1.
          list_external_deps() {
            otool -L "$1" 2>/dev/null \
              | awk 'NR>1 {print $1}' \
              | grep -Ev '^/(usr/lib|System)/' \
              | grep -v '^@' \
              || true
          }

          # Recursively copy a dylib and rewrite install-names.
          copy_deps() {
            local file="$1"
            local dep name
            for dep in $(list_external_deps "$file"); do
              name="$(basename "$dep")"
              if [ ! -f "$FRAMEWORKS/$name" ]; then
                cp -L "$dep" "$FRAMEWORKS/$name"
                chmod +w "$FRAMEWORKS/$name"
                install_name_tool -id "@rpath/$name" "$FRAMEWORKS/$name" 2>/dev/null || true
                copy_deps "$FRAMEWORKS/$name"
              fi
            done
            # Rewrite refs inside $file to use @rpath/.
            for dep in $(list_external_deps "$file"); do
              name="$(basename "$dep")"
              install_name_tool -change "$dep" "@rpath/$name" "$file" 2>/dev/null || true
            done
          }

          LIBMPV_SRC="$(brew --prefix mpv)/lib/libmpv.2.dylib"
          if [ ! -f "$LIBMPV_SRC" ]; then
            echo "libmpv not found at $LIBMPV_SRC"
            ls -la "$(brew --prefix mpv)/lib" || true
            exit 1
          fi
          cp -L "$LIBMPV_SRC" "$FRAMEWORKS/libmpv.2.dylib"
          chmod +w "$FRAMEWORKS/libmpv.2.dylib"
          install_name_tool -id "@rpath/libmpv.2.dylib" "$FRAMEWORKS/libmpv.2.dylib" 2>/dev/null || true
          copy_deps "$FRAMEWORKS/libmpv.2.dylib"

          # Make the main binary look in Frameworks/ first.
          install_name_tool -change \
            "/opt/homebrew/opt/mpv/lib/libmpv.2.dylib" \
            "@rpath/libmpv.2.dylib" \
            "$MAIN" 2>/dev/null || true
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$MAIN" 2>/dev/null || true

          echo "── Frameworks ──"
          ls -la "$FRAMEWORKS"
          echo "── otool -L main ──"
          otool -L "$MAIN" | head -20

      # On Windows we skip the NSIS/MSI bundler (its libmpv-related DLL
      # probing is flaky) and just produce a portable .exe + libmpv-2.dll
      # zip that the user can run directly.
      #
      # NOTE: `cargo build --release` alone is NOT enough here. It
      # bypasses Tauri's asset-embedding pipeline so the produced exe
      # falls back to `devUrl` (http://localhost:1420) at runtime and
      # the WebView shows ERR_CONNECTION_REFUSED. `tauri build
      # --no-bundle` is the correct Tauri 2 way: it embeds the built
      # frontend into the exe and only skips the platform installer.
      - name: Tauri build (Windows, --no-bundle)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run tauri build -- --no-bundle

      - name: Stage Windows portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\portable-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target\release\pstplayer.exe" $out -Force
          Copy-Item "$env:MPV_SOURCE\64\libmpv-2.dll" $out -Force
          Copy-Item "src-tauri\distrib\windows-portable-readme.txt" "$out\README.txt" -Force
          Get-ChildItem $out | Format-List Name, Length

      # ── Upload ───────────────────────────────────────────────────────

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pstplayer-${{ matrix.artifact }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pstplayer-${{ matrix.artifact }}
          # .dmg は libmpv 同梱前の .app を含んでいるので含めない。
          # 修正済み .app (Frameworks/ に libmpv.2.dylib と依存物を内包) のみ。
          path: target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pstplayer-windows-portable
          path: portable-windows/
          if-no-files-found: error
          retention-days: 14

  # `v*` タグが push された時のみ走り、build ジョブの全 OS artifacts
  # を集めてリネーム → SHA-256 添付 → GitHub Releases 公開する。
  # 詳細仕様は docs/release.md §6 を参照。
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Install Rust (for cargo-about)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-about binary
        uses: actions/cache@v4
        id: cache-cargo-about
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.0

      - name: Install cargo-about
        if: steps.cache-cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version '^0.9' --locked --features cli

      - name: Generate THIRD-PARTY.md
        run: cargo about generate about.hbs > THIRD-PARTY.md

      - name: Derive version + prerelease flag
        id: meta
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IS_PRERELEASE=false
          # v0.2.0-rc.1 / -beta.1 / -alpha.1 は prerelease 扱い。
          case "$TAG" in
            *-rc.*|*-beta.*|*-alpha.*) IS_PRERELEASE=true ;;
          esac
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts + compute SHA-256
        shell: bash
        run: |
          set -eu
          V="${{ steps.meta.outputs.version }}"
          OUT=staging
          mkdir -p "$OUT"

          # Linux: 単独ファイル (deb / AppImage / rpm) をそのまま rename。
          for ext in deb AppImage rpm; do
            for f in artifacts/pstplayer-linux/*."$ext"; do
              [ -f "$f" ] || continue
              cp "$f" "$OUT/pstplayer-${V}-linux-x64.${ext}"
            done
          done

          # macOS: .app ディレクトリは zip 化して 1 ファイルにする。
          APP="$(find artifacts/pstplayer-macos -maxdepth 2 -name '*.app' -type d | head -1)"
          if [ -n "${APP:-}" ]; then
            ZIP="pstplayer-${V}-macos-universal.app.zip"
            (cd "$(dirname "$APP")" && zip -qr "$OLDPWD/$OUT/$ZIP" "$(basename "$APP")")
          fi

          # Windows: portable ディレクトリを rename してから zip。
          if [ -d "artifacts/pstplayer-windows-portable" ]; then
            DIR="pstplayer-${V}-windows-x64-portable"
            mv "artifacts/pstplayer-windows-portable" "artifacts/$DIR"
            (cd artifacts && zip -qr "../$OUT/$DIR.zip" "$DIR")
          fi

          # THIRD-PARTY.md (cargo-about 生成) も同梱。
          if [ -f THIRD-PARTY.md ]; then
            cp THIRD-PARTY.md "$OUT/THIRD-PARTY-${V}.md"
          fi

          # SHA-256 サムを 1 ファイルに集約。
          (cd "$OUT" && sha256sum * | tee SHA256SUMS.txt >/dev/null)
          ls -la "$OUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          TAG="${{ steps.meta.outputs.tag }}"
          FLAGS=(--generate-notes --title "PSTPlayer $TAG")
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" staging/* "${FLAGS[@]}"
