name: Build artifacts

# 配布バイナリ生成は重い (libmpv-dev + cargo tauri build × 3 OS) ため、
# PR では走らせず、main へのマージ後 と 手動起動 (workflow_dispatch) のみ。
# PR で動作確認したい場合は Actions タブから "Run workflow" → ブランチ選択。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
            experimental: false
          - os: macos-latest
            artifact: macos
            experimental: false
          - os: windows-latest
            artifact: windows
            experimental: true # mpv-dev linkage on Windows is brittle

    steps:
      - uses: actions/checkout@v4

      # ── OS-specific native deps ──────────────────────────────────────

      - name: Install Tauri + libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libfuse2 \
            libmpv-dev \
            pkg-config

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv pkg-config
          MPV_PREFIX="$(brew --prefix mpv)"
          echo "MPV_PREFIX=${MPV_PREFIX}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L ${MPV_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MPV_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${MPV_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # shinchiro's mpv-dev only ships MinGW import lib (libmpv.dll.a).
          # MSVC needs mpv.lib — generate it from libmpv-2.dll via
          # dumpbin /exports → .def → lib /def:.
          $url  = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260530/mpv-dev-x86_64-v3-20260530-git-13a3e3a.7z'
          $tmp  = "$env:TEMP\mpv-dev.7z"
          $base = "$env:GITHUB_WORKSPACE\mpv-dev"
          $sub  = Join-Path $base '64'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tmp
          New-Item -ItemType Directory -Force -Path $sub | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $tmp -o"$sub" -y

          $dll = Join-Path $sub 'libmpv-2.dll'
          $def = Join-Path $sub 'mpv.def'
          $lib = Join-Path $sub 'mpv.lib'
          $exports = & dumpbin.exe /exports $dll
          $names = @()
          foreach ($line in $exports) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
              $names += $Matches[1]
            }
          }
          if ($names.Count -eq 0) { throw "failed to extract exports from $dll" }
          'EXPORTS' | Out-File -FilePath $def -Encoding ascii
          $names    | Out-File -FilePath $def -Encoding ascii -Append
          & lib.exe /def:$def /out:$lib /machine:x64
          if (-not (Test-Path $lib)) { throw "lib.exe did not produce $lib" }

          "MPV_SOURCE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # tauri build runs the binary briefly during bundling; make
          # sure libmpv-2.dll is on PATH for dynamic load.
          Add-Content -Path $env:GITHUB_PATH -Value $sub

      # ── Toolchains ───────────────────────────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # ── Build ────────────────────────────────────────────────────────

      - name: Tauri build (release)
        run: npm run tauri build

      # ── Upload ───────────────────────────────────────────────────────

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pstplayer-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pstplayer-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pstplayer-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
