name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri + libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libmpv-dev \
            pkg-config

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Install libmpv (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # libmpv2 on Windows expects MPV_SOURCE pointing at a dir
          # with libmpv.dll.a / mpv.lib. The official build of mpv
          # ships these in the dev package.
          choco install -y mpv-dev || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace)
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Build
        run: npm run build
