name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチ / PR で連続して push されたら古い実行をキャンセル。
# (GitHub Actions の無料枠を節約)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true # libmpv linkage on Windows is brittle
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri + libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libmpv-dev \
            pkg-config

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv pkg-config
          MPV_PREFIX="$(brew --prefix mpv)"
          echo "MPV_PREFIX=${MPV_PREFIX}" >> "$GITHUB_ENV"
          # Tell rustc and pkg-config where libmpv lives.
          echo "RUSTFLAGS=-L ${MPV_PREFIX}/lib -D warnings" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MPV_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${MPV_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # libmpv2 v5 (with the build_libmpv feature) looks for
          # mpv.lib / libmpv.dll.a / libmpv-2.dll under MPV_SOURCE/64/.
          # shinchiro/mpv-winbuild-cmake distributes a dev tarball with
          # exactly those files.
          $url  = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20250323/mpv-dev-x86_64-v3-20250323-git-acec74b.7z'
          $tmp  = "$env:TEMP\mpv-dev.7z"
          $base = "$env:GITHUB_WORKSPACE\mpv-dev"
          $sub  = Join-Path $base '64'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tmp
          New-Item -ItemType Directory -Force -Path $sub | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $tmp -o"$sub" -y
          "MPV_SOURCE=$base"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTFLAGS=-D warnings"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set Linux RUSTFLAGS
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace)
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Build
        run: npm run build
