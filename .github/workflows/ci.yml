name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチ / PR で連続して push されたら古い実行をキャンセル。
# (GitHub Actions の無料枠を節約)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri + libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libmpv-dev \
            pkg-config

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv pkg-config
          MPV_PREFIX="$(brew --prefix mpv)"
          echo "MPV_PREFIX=${MPV_PREFIX}" >> "$GITHUB_ENV"
          # Tell rustc and pkg-config where libmpv lives.
          echo "RUSTFLAGS=-L ${MPV_PREFIX}/lib -D warnings" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MPV_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${MPV_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # shinchiro/mpv-winbuild-cmake ships a MinGW-style import
          # library (libmpv.dll.a) but no MSVC import library (mpv.lib).
          # Generate mpv.lib from libmpv-2.dll using dumpbin + lib.exe.
          $url  = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260530/mpv-dev-x86_64-v3-20260530-git-13a3e3a.7z'
          $tmp  = "$env:TEMP\mpv-dev.7z"
          $base = "$env:GITHUB_WORKSPACE\mpv-dev"
          $sub  = Join-Path $base '64'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tmp
          New-Item -ItemType Directory -Force -Path $sub | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $tmp -o"$sub" -y

          # dumpbin /exports → .def → lib /def: → mpv.lib
          $dll = Join-Path $sub 'libmpv-2.dll'
          $def = Join-Path $sub 'mpv.def'
          $lib = Join-Path $sub 'mpv.lib'

          $exports = & dumpbin.exe /exports $dll
          $names = @()
          foreach ($line in $exports) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
              $names += $Matches[1]
            }
          }
          if ($names.Count -eq 0) { throw "failed to extract exports from $dll" }

          'EXPORTS' | Out-File -FilePath $def -Encoding ascii
          $names    | Out-File -FilePath $def -Encoding ascii -Append

          & lib.exe /def:$def /out:$lib /machine:x64
          if (-not (Test-Path $lib)) { throw "lib.exe did not produce $lib" }

          "MPV_SOURCE=$base"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTFLAGS=-D warnings" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # cargo test launches the test binary which loads libmpv-2.dll
          # via the OS loader. GITHUB_PATH was tried and didn't seem to
          # propagate to the test process — copy the DLL into System32
          # so it's found regardless of cwd or PATH order.
          Copy-Item "$sub\libmpv-2.dll" "$env:WINDIR\System32\" -Force

      - name: Set Linux RUSTFLAGS
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace)
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test build (workspace)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-run

      - name: Stage libmpv-2.dll next to test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Test binaries live in target/debug/deps/; the OS loader
          # checks the process directory first, so dropping the DLL
          # there bypasses PATH / System32 / UAC quirks entirely.
          $deps = 'target\debug\deps'
          if (-not (Test-Path $deps)) { throw "no $deps directory" }
          Copy-Item "$env:MPV_SOURCE\64\libmpv-2.dll" $deps -Force
          Get-ChildItem "$deps\libmpv-2.dll" | Format-List FullName, Length

      - name: cargo test (workspace)
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Build
        run: npm run build
